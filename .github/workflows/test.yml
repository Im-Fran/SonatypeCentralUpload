name: "Test"
# Build, validate the plugin and compile the functional tests. No secrets needed:
# the end-to-end upload to Sonatype Central only runs on release (see deploy.yml).
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build Plugin
        run: ./gradlew build --no-daemon
